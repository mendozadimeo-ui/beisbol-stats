name: Update NBA odds snapshot

on:
  # Pausado: nba.html todavia no existe en el sitio, asi que esta corrida gastaba
  # cuota de odds-api.io (compartida con MLB/NFL/Futbol) cada 2 horas por nada.
  # Reactivar el cron cuando el frontend de NBA este listo.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-nba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-nba.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba.json data/nba-history.json
          git diff --cached --quiet || git commit -m "Actualizar cuotas de NBA [automatico]"
          git push
