name: Debug NFL odds-api discovery

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/debug-nfl-odds.mjs
